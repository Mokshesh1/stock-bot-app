<div class="card">

<h1>
Strategy Backtesting
</h1>

<input
id="symbol"
placeholder="Enter NSE symbol (e.g. RELIANCE)"
/>

<select id="strategy">

<option value="ema_crossover">
EMA Crossover
</option>

<option value="rsi">
RSI Oversold
</option>

</select>

<select id="days">

<option value="90">
3 Months
</option>

<option value="180">
6 Months
</option>

<option value="365">
1 Year
</option>

</select>

<button
id="backtest-btn"
type="button"
onclick="runBacktest()"
>
Run Backtest
</button>

</div>

<div id="results"></div>

</div>

<script>

const API_URL =
'/api/backtest';

async function runBacktest(){

const results =
document.getElementById('results')

const symbol =
document
.getElementById('symbol')
.value
.trim()
.toUpperCase()

const strategy =
document
.getElementById('strategy')
.value

const days =
document
.getElementById('days')
.value

if(!symbol){

results.innerHTML = `
<div class="card error">
Please enter a stock symbol
</div>
`

return
}

results.innerHTML = `
<div class="card loading">
Running backtest...
</div>
`

try{

const response =
authenticatedFetch(`https://stock-bot-app-production.up.railway.app/api/backtest`,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
symbol,
strategy,
days
})
}
)

const data =
await response.json()

if(!response.ok){

results.innerHTML = `
<div class="card error">
${data.error || 'Backtest failed'}
</div>
`

return
}

renderResults(data)

}

catch(error){

console.error(
'Backtest error:',
error
)

results.innerHTML = `
<div class="card error">
Error running backtest
</div>
`

}

}

function renderResults(result){

document.getElementById(
'results'
).innerHTML = `

<div class="card">

<h2>
${result.symbol}
—
${result.strategy}
</h2>

<div class="grid">

<div>
Total Return:
<br>
<b>
${result.total_return ?? 0}%
</b>
</div>

<div>
Win Rate:
<br>
<b>
${result.win_rate ?? 0}%
</b>
</div>

<div>
Total Trades:
<br>
<b>
${result.total_trades ?? 0}
</b>
</div>

<div>
Average Return:
<br>
<b>
${result.avg_return ?? 0}%
</b>
</div>

<div>
Max Drawdown:
<br>
<b>
${result.max_drawdown ?? 0}%
</b>
</div>

<div>
Expectancy:
<br>
<b>
${result.expectancy ?? 0}%
</b>
</div>

</div>

</div>

${
result.trades?.length
? `
<div class="card">

<h3>
Trade History
</h3>

<table>

<tr>
<th>Entry</th>
<th>Exit</th>
<th>Return %</th>
</tr>

${result.trades.map(t => `

<tr>
<td>₹${t.entry}</td>
<td>₹${t.exit}</td>
<td>${t.return}%</td>
</tr>

`).join('')}

</table>

</div>
`
: ''
}

`

}

</script>
