<!DOCTYPE html>
<html>
<head>
<title>Screener</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h2>
📈 Stock Screener
</h2>

<form id="scanForm">

<input
id="symbols"
class="form-control mb-3"
value="RELIANCE,TCS,INFY"
/>

<select
id="strategy"
class="form-select mb-3"
>
<option value="ema_crossover">
EMA
</option>
<option value="rsi">
RSI
</option>
</select>

<button class="btn btn-primary">
Run Scan
</button>

</form>

<div
id="results"
class="row mt-4"
></div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app';

document
.getElementById(
'scanForm'
)
.addEventListener(
'submit',
async function(e){

e.preventDefault();

const symbols =
document.getElementById(
'symbols'
).value.split(',');

const strategy =
document.getElementById(
'strategy'
).value;

const response =
await fetch(
`${API_URL}/api/scan`,
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({
symbols,
strategy
})
}
);

const data =
await response.json();

renderResults(
data.results
);

}
);

function renderResults(results){

const container =
document.getElementById(
'results'
);

container.innerHTML='';

results.forEach(result=>{

container.innerHTML += `

<div class="col-md-4 mb-4">

<div class="card">

<div class="card-body">

<h5>${result.symbol}</h5>

<p>
${result.signal}
</p>

<a
href="paper-trade.html"
class="btn btn-success"
>
Trade Now
</a>

</div>

</div>

</div>

`;

});

}

</script>

</body>
</html>
