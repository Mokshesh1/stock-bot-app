<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
/>

<title>Paper Trading - StockBot</title>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<style>
body {
  background:#f8f9fa;
}

.card {
  border:none;
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
</style>

</head>
<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-body p-4">

<h2 class="mb-4">
📄 Place Paper Trade
</h2>

<form id="tradeForm">

<div class="mb-3">
<label class="form-label">
Stock Symbol
</label>

<input
type="text"
class="form-control"
id="symbol"
placeholder="RELIANCE"
required
/>
</div>

<div class="mb-3">
<label class="form-label">
Entry Price
</label>

<input
type="number"
step="0.01"
class="form-control"
id="entry_price"
required
/>
</div>

<div class="mb-3">
<label class="form-label">
Quantity
</label>

<input
type="number"
class="form-control"
id="quantity"
required
/>
</div>

<div class="mb-3">
<label class="form-label">
Strategy
</label>

<select
id="strategy"
class="form-select"
required
>
<option value="ema_crossover">
EMA Crossover
</option>

<option value="rsi">
RSI
</option>

<option value="macd">
MACD
</option>
</select>
</div>

<button
type="submit"
class="btn btn-success w-100"
>
Place Trade
</button>

</form>

<div
id="tradeSuccess"
class="alert alert-success mt-3 d-none"
>
Trade placed successfully
</div>

</div>

</div>

</div>

</div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app';

document
.getElementById('tradeForm')
.addEventListener(
'submit',
async function(e){

e.preventDefault();

const user =
JSON.parse(
localStorage.getItem('user')
);

if(!user){

window.location.href =
'login.html';

return;

}

const payload = {

user_id:
user.id,

symbol:
document
.getElementById('symbol')
.value
.toUpperCase(),

entry_price:
parseFloat(
document
.getElementById('entry_price')
.value
),

quantity:
parseInt(
document
.getElementById('quantity')
.value
),

strategy:
document
.getElementById('strategy')
.value

};

const response =
await fetch(
`${API_URL}/api/trades`,
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:
JSON.stringify(payload)
}
);

const data =
await response.json();

if(data.success){

document
.getElementById(
'tradeSuccess'
)
.classList.remove(
'd-none'
);

setTimeout(()=>{

window.location.href =
'dashboard.html';

},1200);

}

});

</script>

</body>
</html>
