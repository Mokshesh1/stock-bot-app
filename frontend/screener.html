<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>StockBot Screener</title>

<style>
body{
font-family:Arial;
background:#f7f8fc;
margin:0;
}

.container{
max-width:1200px;
margin:auto;
padding:24px;
}

.topbar{
display:flex;
gap:12px;
align-items:center;
margin-bottom:20px;
}

.back-btn{
padding:10px 14px;
border-radius:8px;
border:1px solid #ddd;
background:white;
cursor:pointer;
}

.search-box{
display:flex;
gap:12px;
margin-bottom:24px;
}

input{
flex:1;
padding:14px;
border-radius:10px;
border:1px solid #ddd;
}

button.primary{
padding:14px 18px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.signal{
padding:6px 10px;
border-radius:999px;
display:inline-block;
font-size:12px;
font-weight:bold;
margin-top:10px;
}

.buy{
background:#dcfce7;
color:#166534;
}

.sell{
background:#fee2e2;
color:#991b1b;
}

.hold{
background:#f3f4f6;
color:#374151;
}

.actions{
display:flex;
gap:8px;
margin-top:16px;
}

.small-btn{
flex:1;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.watchlist-btn{
background:#111827;
color:white;
}

.trade-btn{
background:#16a34a;
color:white;
}

.alert-btn{
background:#f59e0b;
color:white;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:24px;
width:400px;
border-radius:14px;
}

select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<button
class="back-btn"
onclick="window.location.href='dashboard.html'"
>
← Dashboard
</button>

<div>
Dashboard / Screener
</div>
</div>

<h1>Stock Screener</h1>

<div class="search-box">
<input
id="symbolInput"
placeholder="RELIANCE, INFY, TCS"
/>

<button
class="primary"
onclick="scanStocks()"
>
Scan Stocks
</button>
</div>

<div
id="results"
class="grid"
></div>

</div>

<div
id="alertModal"
class="modal"
>

<div class="modal-content">

<h3>Create Alert</h3>

<select id="alertType">

<option value="buy_signal">
BUY Signal
</option>

<option value="sell_signal">
SELL Signal
</option>

<option value="score_above">
Score Above
</option>

<option value="price_above">
Price Above
</option>

<option value="price_below">
Price Below
</option>

</select>

<input
id="alertValue"
placeholder="Optional target value"
/>

<button
class="primary"
onclick="saveAlert()"
>
Save Alert
</button>

</div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app'

let selectedSymbol=''

function openAlert(symbol){

selectedSymbol=symbol

document.getElementById(
'alertModal'
).style.display='flex'

}

async function saveAlert(){

const user = JSON.parse(
localStorage.getItem('user')
)

const alert_type =
document.getElementById(
'alertType'
).value

const target_value =
document.getElementById(
'alertValue'
).value || null

await fetch(

`${API_URL}/api/user/${user.id}/alerts`,

{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
symbol:selectedSymbol,
alert_type,
target_value
})
}

)

alert(
'Alert created'
)

document.getElementById(
'alertModal'
).style.display='none'

}

async function scanStocks(){

const input =
document.getElementById(
'symbolInput'
).value.trim()

const symbols = input
? input.split(',').map(
s=>s.trim()
)
: ['RELIANCE','INFY','TCS']

const res = await fetch(

`${API_URL}/api/scan`,

{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
symbols
})
}

)

const data =
await res.json()

renderResults(
data.results
)

}

function renderResults(results){

const container =
document.getElementById(
'results'
)

container.innerHTML=''

results.forEach(stock=>{

container.innerHTML += `

<div class="card">

<h2>${stock.symbol}</h2>

<div class="signal ${stock.signal.toLowerCase()}">
${stock.signal}
</div>

<p>
Score:
<b>${stock.score}</b>
</p>

<p>
Price:
₹${stock.price}
</p>

<p>
Trend:
${stock.trend}
</p>

<div class="actions">

<button
class="small-btn watchlist-btn"
onclick="addToWatchlist('${stock.symbol}')"
>
Watchlist
</button>

<button
class="small-btn trade-btn"
onclick="tradeNow('${stock.symbol}',${stock.entry})"
>
Paper Trade
</button>

<button
class="small-btn alert-btn"
onclick="openAlert('${stock.symbol}')"
>
Create Alert
</button>

</div>

</div>
`
})

}

async function addToWatchlist(symbol){

const user = JSON.parse(
localStorage.getItem('user')
)

await fetch(

`${API_URL}/api/user/${user.id}/watchlist`,

{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
symbol
})
}

)

alert('Added to watchlist')

}

function tradeNow(symbol,price){

window.location.href=
`paper-trade.html?symbol=${symbol}&price=${price}`

}

scanStocks()

</script>

</body>
</html>
