<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
/>

<title>Watchlist - StockBot</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />

<style>

body{
background:#f8f9fa;
}

.card{
border:none;
border-radius:14px;
box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.back-link{
text-decoration:none;
font-weight:500;
}

.price-up{
color:#198754;
font-weight:600;
}

</style>

</head>

<body>

<div class="container py-4">

<div class="mb-3">

<a
href="dashboard.html"
class="back-link"
>
← Back to Dashboard
</a>

</div>

<nav
aria-label="breadcrumb"
class="mb-4"
>

<ol class="breadcrumb">

<li class="breadcrumb-item">
<a href="dashboard.html">
Dashboard
</a>
</li>

<li
class="breadcrumb-item active"
aria-current="page"
>
Watchlist
</li>

</ol>

</nav>

<h2 class="mb-4">
⭐ Watchlist
</h2>

<div
id="watchlistGrid"
class="row"
></div>

</div>

<script>

// Uses shared `script.js` for API URL and auth

async function loadWatchlist(){

const user =
JSON.parse(
localStorage.getItem(
'user'
)
);

if(!user)return;

const response = await Fetch(`/api/user/${user.id}/watchlist`);

const data =
await response.json();

renderWatchlist(
data.watchlist || []
);

}

async function renderWatchlist(items){

const grid =
document.getElementById(
'watchlistGrid'
);

grid.innerHTML='';

if(!items.length){

grid.innerHTML=`

<div class="col-12">

<div class="alert alert-light">

No stocks in watchlist yet

</div>

</div>

`;

return;

}

for(const item of items){

const priceResponse = await authenticatedFetch(`/api/price/${item.symbol}`);
const priceData = await priceResponse.json();

grid.innerHTML += `

<div class="col-md-4 mb-4">

<div class="card h-100">

<div class="card-body">

<h5>
${item.symbol}
</h5>

<p class="price-up">
₹${priceData.price}
</p>

<div class="d-flex gap-2">

<a
href="paper-trade.html?symbol=${item.symbol}"
class="btn btn-success btn-sm"
>
Trade
</a>

<button
class="btn btn-outline-danger btn-sm"
onclick="removeFromWatchlist(${item.id})"
>
Remove
</button>

</div>

</div>

</div>

</div>

`;

}

}

async function removeFromWatchlist(id){

const user =
JSON.parse(
localStorage.getItem(
'user'
)
);

await Fetch(`/api/user/${user.id}/watchlist/${id}`, { method: 'DELETE' });

loadWatchlist();

}

loadWatchlist();

</script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
