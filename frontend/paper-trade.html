<!DOCTYPE html>
<html>
<head>
<title>Paper Trade</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

</head>
<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-body">

<h2>
📄 Paper Trade
</h2>

<form id="tradeForm">

<input
id="symbol"
class="form-control mb-3"
placeholder="Symbol"
required
/>

<input
id="entry_price"
type="number"
class="form-control mb-3"
placeholder="Entry Price"
required
/>

<input
id="quantity"
type="number"
class="form-control mb-3"
placeholder="Quantity"
required
/>

<select
id="strategy"
class="form-select mb-3"
>

<option value="ema_crossover">
EMA
</option>

<option value="rsi">
RSI
</option>

</select>

<button
class="btn btn-success w-100"
>
Place Trade
</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app';

document
.getElementById(
'tradeForm'
)
.addEventListener(
'submit',
async function(e){

e.preventDefault();

const user =
JSON.parse(
localStorage.getItem(
'user'
)
);

await fetch(
`${API_URL}/api/trades`,
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

user_id:user.id,

symbol:
document.getElementById(
'symbol'
).value,

entry_price:
parseFloat(
document.getElementById(
'entry_price'
).value
),

quantity:
parseInt(
document.getElementById(
'quantity'
).value
),

strategy:
document.getElementById(
'strategy'
).value

})

}
);

window.location.href =
'dashboard.html';

}
);

</script>

</body>
</html>
