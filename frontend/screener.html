<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1"
/>

<title>Screener - StockBot</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

<style>
body{
background:#f8f9fa;
}

.card{
border:none;
border-radius:14px;
box-shadow:0 2px 12px rgba(0,0,0,.06);
}
</style>

</head>
<body>

<div class="container mt-5">

<h2 class="mb-4">
📈 Stock Screener
</h2>

<div class="card mb-4">

<div class="card-body">

<form id="scanForm">

<div class="row">

<div class="col-md-8">

<input
type="text"
class="form-control"
id="symbols"
value="RELIANCE,TCS,INFY,HDFC"
placeholder="RELIANCE,TCS,INFY"
/>

</div>

<div class="col-md-4">

<select
id="strategy"
class="form-select"
>

<option value="ema_crossover">
EMA Crossover
</option>

<option value="rsi">
RSI
</option>

</select>

</div>

</div>

<button
class="btn btn-primary mt-3"
type="submit"
>
Run Scan
</button>

</form>

</div>

</div>

<div
id="results"
class="row"
></div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app';

document
.getElementById(
'scanForm'
)
.addEventListener(
'submit',
async function(e){

e.preventDefault();

const symbols =
document
.getElementById(
'symbols'
)
.value
.split(',');

const strategy =
document
.getElementById(
'strategy'
)
.value;

const response =
await fetch(
`${API_URL}/api/scan`,
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

symbols,
strategy

})

}
);

const data =
await response.json();

renderResults(
data.results
);

});

function renderResults(results){

const container =
document
.getElementById(
'results'
);

container.innerHTML='';

results.forEach(result=>{

container.innerHTML += `

<div class="col-md-4 mb-4">

<div class="card">

<div class="card-body">

<h5>
${result.symbol}
</h5>

<p>

Signal:

<strong
class="${
result.signal === 'BUY'
? 'text-success'
: 'text-warning'
}"
>

${result.signal}

</strong>

</p>

<p>

Price:
₹${result.price || '-'}

</p>

<a
href="paper-trade.html"
class="btn btn-success btn-sm"
>

Trade Now

</a>

</div>

</div>

</div>

`;

});

}

</script>

</body>
</html>
