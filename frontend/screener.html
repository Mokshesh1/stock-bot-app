<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
/>

<title>StockBot Screener</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f7f8fc;
margin:0;
padding:0;
}

.container{
max-width:1200px;
margin:auto;
padding:24px;
}

.topbar{
display:flex;
align-items:center;
gap:12px;
margin-bottom:16px;
}

.back-btn{
background:#fff;
border:1px solid #ddd;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.breadcrumb{
font-size:14px;
color:#666;
}

h1{
margin-top:0;
}

.search-box{
display:flex;
gap:12px;
margin-bottom:28px;
}

input{
flex:1;
padding:14px;
font-size:16px;
border-radius:10px;
border:1px solid #ddd;
}

button.primary{
background:#2563eb;
color:white;
border:none;
padding:14px 18px;
border-radius:10px;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:14px;
padding:20px;
box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.symbol{
font-size:22px;
font-weight:700;
}

.signal{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-size:13px;
font-weight:700;
margin-top:10px;
}

.buy{
background:#dcfce7;
color:#166534;
}

.sell{
background:#fee2e2;
color:#991b1b;
}

.hold{
background:#f3f4f6;
color:#374151;
}

.score{
font-size:32px;
font-weight:700;
margin-top:12px;
}

.section{
margin-top:18px;
font-size:14px;
line-height:1.7;
}

.metrics{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
font-size:14px;
}

.actions{
display:flex;
gap:12px;
margin-top:18px;
}

.small-btn{
flex:1;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.watchlist-btn{
background:#111827;
color:white;
}

.trade-btn{
background:#16a34a;
color:white;
}

.meta{
margin-top:14px;
font-size:12px;
color:#777;
}

.loading{
text-align:center;
padding:40px;
color:#666;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">

<button
class="back-btn"
onclick="window.location.href='dashboard.html'"
>
← Dashboard
</button>

<div class="breadcrumb">
Dashboard / Screener
</div>

</div>

<h1>Stock Screener</h1>

<div class="search-box">

<input
id="symbolInput"
placeholder="RELIANCE, INFY, TCS"
/>

<button
class="primary"
onclick="scanStocks()"
>
Scan Stocks
</button>

</div>

<div
id="results"
class="grid"
></div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app'

async function scanStocks(){

const input =
document.getElementById(
'symbolInput'
).value.trim()

const symbols = input
? input.split(',').map(
s => s.trim().toUpperCase()
)
: [
'RELIANCE',
'TCS',
'INFY',
'HDFCBANK'
]

const container =
document.getElementById(
'results'
)

container.innerHTML = `
<div class="loading">
Scanning market...
</div>
`

try{

const response =
await fetch(
`${API_URL}/api/scan`,
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
symbols
})
}
)

const data =
await response.json()

renderResults(
data.results
)

}catch(err){

container.innerHTML =
'Error loading signals'

}

}

function renderResults(results){

const container =
document.getElementById(
'results'
)

container.innerHTML=''

results.forEach(stock=>{

const signalClass =
stock.signal.toLowerCase()

container.innerHTML += `

<div class="card">

<div class="symbol">
${stock.symbol}
</div>

<div class="signal ${signalClass}">
${stock.signal}
</div>

<div class="score">
${stock.score}/100
</div>

<div class="section">

<strong>Trend:</strong>
${stock.trend}

<br>

<strong>Live Price:</strong>
₹${stock.price}

</div>

<div class="metrics">

<div>
Technical:
<b>${stock.technical_score}</b>
</div>

<div>
Fundamental:
<b>${stock.fundamental_score}</b>
</div>

<div>
Sentiment:
<b>${stock.sentiment_score}</b>
</div>

<div>
Grade:
<b>${stock.fundamental_grade}</b>
</div>

</div>

<div class="section">

<strong>Trade Setup</strong>

<br>

Entry:
₹${stock.entry}

<br>

TP1:
₹${stock.tp1}

<br>

TP2:
₹${stock.tp2}

<br>

Stop Loss:
₹${stock.stop_loss}

</div>

<div class="section">

<strong>Why this signal?</strong>

<br>

${stock.explanation.technical}

<br>

${stock.explanation.fundamental}

<br>

${stock.explanation.sentiment}

</div>

<div class="actions">

<button
class="small-btn watchlist-btn"
onclick="addToWatchlist(
'${stock.symbol}'
)"
>
+ Watchlist
</button>

<button
class="small-btn trade-btn"
onclick="tradeNow(
'${stock.symbol}',
${stock.entry}
)"
>
Paper Trade
</button>

</div>

<div class="meta">

Generated from predefined
technical, fundamental,
and sentiment models for
educational purposes only.

<br><br>

Updated:
${new Date(
stock.last_updated
).toLocaleString()}

</div>

</div>

`

})

}

async function addToWatchlist(
symbol
){

const user =
JSON.parse(
localStorage.getItem(
'user'
)
)

if(!user)return

await fetch(

`${API_URL}/api/user/${user.id}/watchlist`,

{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
symbol
})
}

)

alert(
`${symbol} added to watchlist`
)

}

function tradeNow(
symbol,
entry
){

window.location.href =
`paper-trade.html?symbol=${symbol}&price=${entry}`

}

scanStocks()

</script>

</body>
</html>
