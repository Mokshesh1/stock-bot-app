<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
/>

<title>Paper Trade - StockBot</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

<style>

body{
background:#f8f9fa;
}

.card{
border:none;
border-radius:14px;
box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.back-link{
text-decoration:none;
font-weight:500;
}

</style>

</head>
<body>

<div class="container py-4">

<div class="mb-3">

<a
href="dashboard.html"
class="back-link"
>
← Back to Dashboard
</a>

</div>

<nav
aria-label="breadcrumb"
class="mb-4"
>

<ol class="breadcrumb">

<li class="breadcrumb-item">
<a href="dashboard.html">
Dashboard
</a>
</li>

<li
class="breadcrumb-item active"
aria-current="page"
>
Paper Trade
</li>

</ol>

</nav>

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-body">

<h2 class="mb-4">
📄 Paper Trade
</h2>

<form id="tradeForm">

<input
id="symbol"
class="form-control mb-3"
placeholder="Symbol"
required
/>

<input
id="entry_price"
type="number"
step="0.01"
class="form-control mb-3"
placeholder="Entry Price"
required
/>

<input
id="quantity"
type="number"
class="form-control mb-3"
placeholder="Quantity"
required
/>

<select
id="strategy"
class="form-select mb-3"
>

<option value="ema_crossover">
EMA Crossover
</option>

<option value="rsi">
RSI
</option>

</select>

<button
class="btn btn-success w-100"
>
Place Trade
</button>
<div class="alert alert-light mt-3 small">

Paper trading only — no live orders are sent to any broker or exchange.

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app';

const params =
new URLSearchParams(
window.location.search
);

const symbol =
params.get('symbol');

if(symbol){

document.getElementById(
'symbol'
).value = symbol;

}

document
.getElementById(
'tradeForm'
)
.addEventListener(
'submit',
async function(e){

e.preventDefault();

const user =
JSON.parse(
localStorage.getItem(
'user'
)
);

await fetch(
`${API_URL}/api/trades`,
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

user_id:user.id,

symbol:
document.getElementById(
'symbol'
).value,

entry_price:
parseFloat(
document.getElementById(
'entry_price'
).value
),

quantity:
parseInt(
document.getElementById(
'quantity'
).value
),

strategy:
document.getElementById(
'strategy'
).value

})

}
);

window.location.href =
'dashboard.html';

}
);

</script>

</body>
<footer class="mt-5 py-4 border-top bg-white">

<div class="container">

<div class="row">

<div class="col-md-6 text-md-end">
<a
href="about.html"
class="text-decoration-none me-3"
>
About
</a>
<a
href="terms.html"
class="text-decoration-none me-3"
>
Terms
</a>

<a
href="privacy.html"
class="text-decoration-none me-3"
>
Privacy
</a>

<a
href="disclaimer.html"
class="text-decoration-none"
>
Disclaimer
</a>

</div>

</div>

</div>
</html>
