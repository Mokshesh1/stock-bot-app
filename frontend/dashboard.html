<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
/>

<title>StockBot Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

</head>

<body class="bg-light">

<div class="container mt-4">

<h2 class="mb-4">
📈 Dashboard
</h2>

<div class="row mb-4">

<div class="col-md-3">
<div class="card">
<div class="card-body">
<h6>Total Profit</h6>
<h3 id="totalProfit">
₹0
</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<h6>Win Rate</h6>
<h3 id="winRate">
—
</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<h6>Max Drawdown</h6>
<h3 id="maxDrawdown">
₹0
</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<h6>Best Strategy</h6>
<h3 id="bestStrategy">
—
</h3>
</div>
</div>
</div>

</div>

<div class="card mb-4">

<div class="card-body">

<h5>
⭐ Watchlist
</h5>

<div
id="watchlistContainer"
></div>

</div>

</div>

<div class="mb-3">

<select
id="tradeFilter"
class="form-select"
onchange="loadDashboard()"
>

<option value="all">
All
</option>

<option value="today">
Today
</option>

<option value="week">
This Week
</option>

<option value="month">
This Month
</option>

</select>

</div>

<div class="card">

<div class="card-body">

<h5>
Trades
</h5>

<table class="table">

<thead>
<tr>
<th>Symbol</th>
<th>Entry</th>
<th>Status</th>
<th>P&L</th>
<th>Live Price</th>
</tr>
</thead>

<tbody
id="tradeTableBody"
></tbody>

</table>

</div>

</div>

</div>

<script>

const API_URL =
'https://stock-bot-app-production.up.railway.app';

async function loadDashboard(){

const user =
JSON.parse(
localStorage.getItem(
'user'
)
);

if(!user)return;

const userId =
user.id;

const stats =
await fetch(
`${API_URL}/api/user/${userId}/stats`
);

const statsData =
await stats.json();

document.getElementById(
'totalProfit'
).textContent =
`₹${statsData.total_profit}`;

document.getElementById(
'winRate'
).textContent =
`${statsData.win_rate}%`;

const analytics =
await fetch(
`${API_URL}/api/user/${userId}/analytics`
);

const analyticsData =
await analytics.json();

document.getElementById(
'maxDrawdown'
).textContent =
`₹${analyticsData.max_drawdown}`;

document.getElementById(
'bestStrategy'
).textContent =
analyticsData.best_strategy || '—';

const watchlist =
await fetch(
`${API_URL}/api/user/${userId}/watchlist`
);

const watchlistData =
await watchlist.json();

renderWatchlist(
watchlistData.watchlist
);

const trades =
await fetch(
`${API_URL}/api/user/${userId}/trades`
);

const tradesData =
await trades.json();

renderTrades(
tradesData.trades
);

}

function renderWatchlist(items){

const container =
document.getElementById(
'watchlistContainer'
);

container.innerHTML='';

items.forEach(item=>{

container.innerHTML += `

<span class="badge bg-dark me-2">

${item.symbol}

</span>

`;

});

}

async function renderTrades(trades){

const tbody =
document.getElementById(
'tradeTableBody'
);

tbody.innerHTML='';

for(const trade of trades){

const priceResponse =
await fetch(
`${API_URL}/api/price/${trade.symbol}`
);

const priceData =
await priceResponse.json();

tbody.innerHTML += `

<tr>

<td>${trade.symbol}</td>

<td>
₹${trade.entry_price}
</td>

<td>
${trade.status}
</td>

<td>
₹${trade.profit_loss || '-'}
</td>

<td>
₹${priceData.price}
</td>

</tr>

`;

}

}

loadDashboard();

</script>

</body>
</html>
